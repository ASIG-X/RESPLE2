/**:
  ros__parameters:
    topic_imu: /livox/imu
    acc_ratio: true
    lidars: ["AviaResple"]
    AviaResple:
      topic_lidar: /livox/lidar
      lidar_type: AviaResple
      scan_line: 6
      blind: 0.5
      q_lb: [1.0, 0.0, 0.0, 0.0]
      t_lb: [-0.04165, -0.02326, 0.0284]
      w_pt: 0.01
      dept_err: 0.02
      beam_err: 0.05
      ds_scan_voxel: 0.5
      if_dense_map: true
      lidar_time_offset: 0.0
    lidar_time_offset: 0.0
    cameras: ["zed"]
    zed:
      topic_camera: /zed/zed_node/rgb/color/rect/image/compressed
      topic_info: /zed/zed_node/rgb/color/rect/image/camera_info
      if_compressed: true
      if_vignette_correct: false
      if_undist: true
      if_camera_info: true
      cam_model: Pinhole
      cam_width: 960
      cam_height: 540
      scale: 1.0
      q_cb: [0.49661375, -0.49538812, -0.50004923, -0.50785447]
      t_cb: [-0.01796086, 0.09829835, -0.06517441]
      time_offset: 0.0

    if_visual: true
    if_kin: false

    img_point_cov: 10.0
    img_huber_loss: 3.0
    grid_n_height: 10
    max_allow_err: 20.0
    pub_img_scale: 0.5

    point_filter_num: 1
    nn_thresh: 0.5
    lidar_cov_floor: 0.0001
    coeff_cov: 10.0
    max_layer: 2

    min_knot_hz: 20
    num_imu_upd: 3
    thresh_p: 1.0
    thresh_del: 0.1
    thresh_dv: 0.2
    dynamic_min_dt_ms: 35.0
    num_points_upd: 500
    geometry_batch:
      enabled: true
      check_stride: 64
      min_information: 10000.0
      min_eigen_ratio: 0.01
    pred_acc_cov: [1.0,1.0,1.0]
    pred_gyro_cov: [0.1,0.1,0.1]

    cov_P0: 0.02
    cov_RCP_pos_old: 0.1
    cov_RCP_ort_old: 0.1
    cov_RCP_pos_new: 0.1
    cov_RCP_ort_new: 0.1
    std_sys_pos: 0.1
    std_sys_ort: 0.1
    cov_acc: [1.0,1.0,1.0]
    acc_huber_delta: 1.0
    cov_gyro: [0.0001,0.0001,0.0001]
    bias_acc_initial_var: [0.0002, 0.0002, 0.0002]
    bias_gyro_initial_var: [0.0002, 0.0002, 0.0002]
    bias_acc_rw_psd: [0.000002, 0.000002, 0.000002]
    bias_gyro_rw_psd: [0.000002, 0.000002, 0.000002]
    n_iter: 3

    if_loop_closure: true
    w_lc: 10.0
    w_odom: 10.0
    if_loss_func: true
    loss_func_thresh: 1.0
    thresh_kf_translation: 5.0
    ds_kf_voxel: 0.5
    thresh_tf_dist: 20.0
    if_rbg_map: true
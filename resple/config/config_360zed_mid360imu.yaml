/**:
  ros__parameters:
    topic_imu: /livox/imu
    acc_ratio: true 
    lidars: ["HAP360"]
    cameras: ["zed"]
    HAP360:
      topic_lidar: /livox/lidar 
      lidar_type: HAP360
      scan_line: 4
      blind: 0.5
      q_lb: [1.0, 0.0, 0.0, 0.0]        
      t_lb: [0.011, 0.02329, -0.04412]  
      w_pt: 0.01
      dept_err: 0.02
      beam_err: 0.05    
      ds_scan_voxel: 0.5
      if_dense_map: true      
    lidar_time_offset: 0.0
    zed:
      topic_camera: /zed/zed_node/rgb/color/rect/image/compressed
      topic_info: /zed/zed_node/rgb/color/rect/image/camera_info
      if_compressed: true
      if_vignette_correct: false
      if_undist: false
      if_camera_info: true
      cam_model: Pinhole
      cam_width: 960
      cam_height: 540

      scale: 1.0
      q_cb: [0.57862980, -0.39760755, -0.40961337, -0.58250552]
      t_cb: [0.01114350, 0.07078748, -0.04292827]
      time_offset: 0.0  
    lidar_time_offset: 0.0 

    min_knot_hz: 10
    if_visual: true
    if_kin: false

    plot_flag: false
    img_point_cov: 1000.0
    img_huber_loss: 3.0
    if_rbg_map: false
    grid_n_height: 10
    max_allow_err: 10.0

    point_filter_num: 1
    nn_thresh: 0.5
    lidar_cov_floor: 0.0001
    coeff_cov: 5.0

    max_layer: 2      

    num_imu_upd: 3
    thresh_p: 1.0
    thresh_del: 0.2    
    pub_img_scale: 0.25   

    cov_P0: 0.02
    cov_RCP_pos_old: 0.1
    cov_RCP_ort_old: 0.1
    cov_RCP_pos_new: 0.1
    cov_RCP_ort_new: 0.1
    std_sys_pos: 0.1
    std_sys_ort: 0.1
    cov_acc: [1.0,1.0,1.0]
    acc_huber_delta: 0.0

    cov_gyro: [0.0001,0.0001,0.0001]     
    bias_acc_initial_var: [0.0002, 0.0002, 0.0002]
    bias_gyro_initial_var: [0.0002, 0.0002, 0.0002]
    bias_acc_rw_psd: [0.000002, 0.000002, 0.000002]
    bias_gyro_rw_psd: [0.000002, 0.000002, 0.000002]        
    n_iter: 3     
    num_points_upd: 500
    geometry_batch:
      enabled: true
      check_stride: 64
      min_information: 10000.0
      min_eigen_ratio: 0.01
    num_threads: 5
    opencv_num_threads: -1
    pred_acc_cov: [1.0,1.0,1.0]
    pred_gyro_cov: [0.1, 0.1, 0.1]

    if_loop_closure: true
    w_lc: 10.0
    w_odom: 10.0
    if_loss_func: true
    loss_func_thresh: 1.0     
    thresh_kf_translation: 5.0
    ds_kf_voxel: 0.5
    thresh_tf_dist: 5.0

    ds_gm_scan_voxel: 0.5
